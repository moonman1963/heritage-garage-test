<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Reset Password · Heritage Garage</title><style>:root{--b:#0d110f;--p:#161c18;--g:#183a30;--x:#245343;--a:#c8a96b;--c:#efe5d2;--m:#aab0ab;--l:#304138}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--c);font-family:-apple-system,sans-serif}.app{max-width:640px;margin:auto;padding:42px 20px}h1,h2{font-family:Georgia,serif}.hero,.panel{border:1px solid var(--l);border-radius:18px;padding:18px;margin:14px 0}.hero{background:linear-gradient(145deg,var(--x),#10251e)}.panel{background:var(--p)}.k,label{color:var(--a);font-size:11px;text-transform:uppercase;letter-spacing:.1em}label{display:block;margin:13px 0 5px}input,button{font:inherit;width:100%;padding:13px;border-radius:11px}input{background:#111713;color:var(--c);border:1px solid var(--l)}button{background:var(--g);color:var(--c);border:1px solid var(--a);margin-top:12px}.small{font-size:13px;color:var(--m);line-height:1.45}.hidden{display:none}</style></head><body><div class="app"><h1>Heritage Garage</h1><div class="hero"><div class="k">Account recovery</div><h2>Choose a new password</h2><p>Set the password you will use to sign in to your private Garage.</p></div><div id="wait" class="panel small">Verifying your secure recovery link…</div><div id="form" class="panel hidden"><label>New password</label><input id="p1" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="p2" type="password" autocomplete="new-password"><button onclick="savePassword()">Save New Password</button><div id="msg" class="small"></div></div></div><script>const CFG='https://xwonoqlmmtawlhuhohyi.supabase.co/functions/v1/heritage-public-config';let sb;async function boot(){try{const r=await fetch(CFG);if(!r.ok)throw new Error('Configuration unavailable');const c=await r.json();sb=supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});await new Promise(res=>setTimeout(res,500));const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('This recovery link is invalid or has expired. Request a new password-reset email.');wait.classList.add('hidden');form.classList.remove('hidden')}catch(e){wait.textContent=e.message}}async function savePassword(){msg.textContent='';if(p1.value.length<8)return msg.textContent='Use at least 8 characters.';if(p1.value!==p2.value)return msg.textContent='Passwords do not match.';msg.textContent='Saving…';const {error}=await sb.auth.updateUser({password:p1.value});if(error)return msg.textContent=error.message;msg.textContent='Password updated. Returning to Heritage Garage…';setTimeout(()=>location.href='./',900)}boot();</script></body></html>
