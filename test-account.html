id="msg" class="msg"></div></div></main><script>const sb=supabase.createClient('https://aussibufjvikngojwczy.supabase.co','sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i'),$=x=>document.getElementById(x);function msg(t,e=false){$('msg').textContent=t;$('msg').className=e?'msg error':'msg'}async function run(kind){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Enter both email and password.',true);if(password.length<6)return msg('Use at least 6 characters for the password.',true);let b=$(kind);b.disabled=true;try{if(kind==='signup'){let{data,error}=await sb.auth.signUp({email,password});if(error)return msg(error.message,true);msg(data.session?'Account created and signed in.':'Account created. Check your email for the verification message, then return here and sign in.')}else{let{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return msg(error.message,true);msg('Signed in successfully as '+data.user.email+'. The test account is ready.')}}finally{b.disabled=false}}$('signup').onclick=()=>run('signup');$('signin').onclick=()=>run('signin');</script></body></html>
