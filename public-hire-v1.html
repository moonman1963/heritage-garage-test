<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Heritage · Vehicle for your event</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#09100d;--panel:#141a17;--line:#2e3933;--gold:#c8aa6d;--green:#183b30;--text:#f4efe7;--muted:#a8b0aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 60px}.brand{display:flex;align-items:center;gap:11px}.crest{width:48px;height:48px;border:2px solid var(--gold);border-radius:15px;display:grid;place-items:center;color:var(--gold);font-weight:750}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.hero{min-height:230px;background:linear-gradient(145deg,#214b3c,#10221c);display:flex;align-items:end}.muted{color:var(--muted);font-size:13px;line-height:1.5}h1,h2,h3{font-family:Georgia;margin:0}.pill{display:inline-block;border:1px solid #5b6961;border-radius:999px;padding:5px 8px;font-size:11px;margin:5px 5px 0 0}label{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0f1512;color:var(--text);font-size:16px}textarea{min-height:110px}.btn{width:100%;border:1px solid var(--gold);background:var(--green);color:var(--text);padding:14px;border-radius:14px;font-weight:700;margin-top:14px}.status{padding:12px;border-left:3px solid var(--gold);background:#101612;border-radius:9px;margin:10px 0}.hidden{display:none}.success{color:#a7e4c0}.error{color:#ffbaba}</style></head><body><main class="app"><div class="brand"><div class="crest">HG</div><div><h2>Heritage</h2><div class="muted">Vehicle story & event enquiry</div></div></div><div id="loading" class="card">Loading vehicle…</div><section id="content" class="hidden"><div class="hero card"><div><div class="muted">HERITAGE VEHICLE</div><h1 id="title"></h1><div id="meta" class="muted"></div></div></div><div class="card"><h3 id="eventTitle"></h3><p id="desc" class="muted"></p><div id="pills"></div><div id="note" class="status hidden"></div></div><div class="card"><h3>Request this vehicle</h3><p class="muted">This is an enquiry, not a confirmed booking. The owner or rental partner will respond.</p><label>Your name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Phone (optional)</label><input id="phone" type="tel"><label>Event type</label><select id="eventType"></select><label>Event date (optional)</label><input id="eventDate" type="date"><label>Location (optional)</label><input id="location"><label>Tell us about the event</label><textarea id="message"></textarea><button class="btn" id="send">Send Enquiry</button><div id="msg" class="muted" style="margin-top:10px"></div></div></section></main><script>const U='https://aussibufjvikngojwczy.supabase.co',K='sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i',sb=supabase.createClient(U,K),$=x=>document.getElementById(x);let qr=new URLSearchParams(location.search).get('qr'),vehicle=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!qr){$('loading').innerHTML='<span class="error">This Heritage link is incomplete.</span>';return}const{data,error}=await sb.rpc('get_public_hire_vehicle',{p_qr_token:qr});if(error||!data?.length){$('loading').innerHTML='<b>Vehicle unavailable</b><p class="muted">This vehicle is not currently available for public event enquiries.</p>';return}vehicle=data[0];$('loading').classList.add('hidden');$('content').classList.remove('hidden');let name=vehicle.vehicle_name||[vehicle.year,vehicle.make,vehicle.model].filter(Boolean).join(' ')||'This vehicle';$('title').textContent=name;$('meta').textContent=[vehicle.year,vehicle.make,vehicle.model,vehicle.current_location_general].filter(Boolean).join(' · ');$('eventTitle').textContent=name+' for your event';$('desc').textContent=vehicle.hire_description||'Request this vehicle for a wedding or special event.';$('pills').innerHTML=(vehicle.event_types||['wedding']).map(x=>'<span class="pill">'+esc(x)+'</span>').join('');if(vehicle.enquiry_note){$('note').textContent=vehicle.enquiry_note;$('note').classList.remove('hidden')}$('eventType').innerHTML=(vehicle.event_types||['wedding']).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}$('send').onclick=async()=>{let name=$('name').value.trim(),email=$('email').value.trim(),m=$('msg');if(!name||!email){m.className='error';m.textContent='Enter your name and email.';return}let b=$('send');b.disabled=true;b.textContent='Sending…';m.textContent='';const{data,error}=await sb.rpc('submit_public_hire_enquiry',{p_qr_token:qr,p_requester_name:name,p_requester_email:email,p_requester_phone:$('phone').value.trim()||null,p_event_type:$('eventType').value,p_event_date:$('eventDate').value||null,p_event_location:$('location').value.trim()||null,p_message:$('message').value.trim()||null});b.disabled=false;b.textContent='Send Enquiry';if(error){m.className='error';m.textContent=error.message;return}m.className='success';m.textContent='Enquiry sent. The owner or rental partner can now respond.';$('send').disabled=true};load();</script></body></html>
