<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Heritage · Invitations</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#09100d;--panel:#141a17;--line:#2e3933;--gold:#c8aa6d;--green:#183b30;--text:#f4efe7;--muted:#a8b0aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.muted{color:var(--muted);font-size:13px;line-height:1.5}h1,h2,h3{font-family:Georgia;margin:0}.btn{width:100%;border:1px solid var(--gold);background:var(--green);color:var(--text);padding:14px;border-radius:14px;font-weight:700;margin-top:12px}.status{padding:12px;border-left:3px solid var(--gold);background:#101612;border-radius:9px;margin:10px 0}.error{color:#ffbaba}.success{color:#a7e4c0}</style></head><body><main class="app"><div class="card"><h2>Heritage</h2><div class="muted">Vehicle access invitations</div></div><div id="state" class="card">Checking your Heritage account…</div><div id="list"></div><button class="btn" onclick="location.href='/index-v38.html'">Back to Heritage</button></main><script>const U='https://aussibufjvikngojwczy.supabase.co',K='sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i',sb=supabase.createClient(U,K),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){$('state').innerHTML='<b>Sign in required</b><p class="muted">Open the main Heritage app and sign in with the email address that received the invitation.</p>';return}let email=session.user.email||'';$('state').innerHTML='<b>Signed in as '+esc(email)+'</b><p class="muted">Only invitations sent to this exact email address can be accepted.</p>';const{data,error}=await sb.from('vehicle_access_invites').select('invite_id,vehicle_id,recipient_email,role,status,created_at,vehicles(vehicle_name,make,model,year,heritage_id)').eq('status','pending').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}let rows=data||[];$('list').innerHTML=rows.length?rows.map(x=>{let v=x.vehicles||{},name=v.vehicle_name||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle';return '<div class="card"><h3>'+esc(name)+'</h3><div class="muted">'+esc(v.heritage_id||'')+'</div><div class="status"><b>'+esc(x.role.replaceAll('_',' '))+'</b><br><span class="muted">Invitation sent to '+esc(x.recipient_email)+'</span></div><button class="btn" data-accept="'+esc(x.invite_id)+'">Accept Access</button><div class="muted" id="msg-'+esc(x.invite_id)+'"></div></div>'}).join(''):'<div class="card"><b>No pending invitations</b><p class="muted">There are no vehicle access invitations waiting for this account.</p></div>';document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{let id=b.dataset.accept,m=document.getElementById('msg-'+id);b.disabled=true;b.textContent='Accepting…';const{error}=await sb.rpc('accept_vehicle_access_invite',{p_invite_id:id});if(error){m.className='error';m.textContent=error.message;b.disabled=false;b.textContent='Accept Access';return}m.className='success';m.textContent='Access accepted. The vehicle will now appear in your Garage.';setTimeout(()=>location.href='/index-v38.html',900)})}load();</script></body></html>
