<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Heritage · Vehicle Market</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#09100d;--panel:#141a17;--line:#2e3933;--gold:#c8aa6d;--text:#f4efe7;--muted:#a8b0aa;--green:#183b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.hero{min-height:250px;background:linear-gradient(145deg,#214b3c,#10221c);display:flex;align-items:end}.muted{color:var(--muted);font-size:13px;line-height:1.5}.brand{display:flex;align-items:center;gap:11px}.crest{width:48px;height:48px;border:2px solid var(--gold);border-radius:15px;display:grid;place-items:center;color:var(--gold);font-weight:750}h1,h2,h3{font-family:Georgia;margin:0}.price{font-family:Georgia;font-size:28px;margin-top:8px}.pill{display:inline-block;border:1px solid #5b6961;border-radius:999px;padding:5px 8px;font-size:11px;margin:5px 5px 0 0}.status{padding:12px;border-left:3px solid var(--gold);background:#101612;border-radius:9px;margin:10px 0}.hidden{display:none}</style></head><body><main class="app"><div class="brand"><div class="crest">HG</div><div><h2>Heritage</h2><div class="muted">Vehicle market</div></div></div><div id="loading" class="card">Loading listing…</div><section id="content" class="hidden"><div class="hero card"><div><div class="muted">HERITAGE MARKET</div><h1 id="title"></h1><div id="meta" class="muted"></div></div></div><div class="card"><div id="type" class="pill"></div><div id="price" class="price"></div><p id="desc" class="muted"></p><div class="status"><b>Owner-controlled listing</b><br><span class="muted">This listing refers to the same permanent Heritage vehicle record. The vehicle is not duplicated when it is offered for sale.</span></div><div id="contact" class="status"></div></div></section></main><script>const U='https://aussibufjvikngojwczy.supabase.co',K='sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i',sb=supabase.createClient(U,K),$=x=>document.getElementById(x);let qr=new URLSearchParams(location.search).get('qr');async function load(){if(!qr){$('loading').textContent='This Heritage market link is incomplete.';return}const{data,error}=await sb.rpc('get_public_market_listing',{p_qr_token:qr});if(error||!data?.length){$('loading').innerHTML='<b>Listing unavailable</b><p class="muted">This vehicle is not currently offered publicly in the Heritage market.</p>';return}let x=data[0],name=x.vehicle_name||[x.year,x.make,x.model].filter(Boolean).join(' ')||'Vehicle';$('loading').classList.add('hidden');$('content').classList.remove('hidden');$('title').textContent=x.title||name;$('meta').textContent=[x.year,x.make,x.model,x.current_location_general].filter(Boolean).join(' · ');$('type').textContent=(x.listing_type||'sale').replaceAll('_',' ');$('price').textContent=x.asking_price?x.currency+' '+Number(x.asking_price).toLocaleString():'Price on enquiry';$('desc').textContent=x.description||'Contact route selected by the owner.';let route={in_app:'Enquiries are routed through Heritage.',owner_direct:'Enquiries are handled directly by the owner.',agent:'Enquiries are handled by the owner’s nominated agent or partner.'};$('contact').innerHTML='<b>Enquiry route</b><br><span class="muted">'+(route[x.contact_mode]||'Contact details are controlled by the owner.')+'</span>'}load();</script></body></html>
