<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2f27"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Heritage Garage</title><style>:root{--b:#0d110f;--p:#161c18;--g:#183a30;--x:#245343;--a:#c8a96b;--c:#efe5d2;--m:#aab0ab;--l:#304138}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--c);font-family:-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:30px 18px 130px}h1,h2{font-family:Georgia,serif}.panel,.hero,.vehicle{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(145deg,var(--x),#10251e)}.k,label{color:var(--a);font-size:11px;text-transform:uppercase;letter-spacing:.1em}label{display:block;margin:12px 0 5px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border-radius:11px}input,textarea,select{background:#111713;color:var(--c);border:1px solid var(--l)}button{background:var(--g);color:var(--c);border:1px solid var(--a);margin-top:9px}.secondary{background:var(--p);border-color:var(--l)}.small{font-size:13px;color:var(--m);line-height:1.45}.hidden{display:none!important}.section{display:none}.active{display:block}.vehicle{cursor:pointer}.tag{display:inline-block;border:1px solid var(--a);border-radius:99px;padding:4px 8px;font-size:11px}.ev{padding:9px 0;border-bottom:1px solid var(--l)}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d110ff5;border-top:1px solid var(--l);padding:10px}.navin{max-width:760px;margin:auto;display:flex;gap:7px}.nav button{border:0;background:none;font-size:12px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #66786d;border-top-color:var(--a);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><div class="app">
<div id="setup"><h1>Heritage Garage</h1><div class="hero"><div class="k">HG v2.2</div><h2>Connect Supabase</h2></div><div class="panel"><label>Project URL</label><input id="cfgUrl"><label>Publishable key</label><textarea id="cfgKey"></textarea><button onclick="saveCfg()">Save & Connect</button></div></div>
<div id="login" class="hidden"><h1>Heritage Garage</h1><div class="panel"><label>Email</label><input id="email" type="email"><label>Password</label><input id="pw" type="password"><button onclick="signIn()">Sign In</button><div id="loginMsg" class="small"></div></div></div>
<div id="main" class="hidden"><div id="home"><h1>Heritage Garage</h1><div class="hero"><div class="k">Your heritage vehicles</div><h2>My Garage</h2><p>Preserve the story. Protect the provenance.</p></div><div id="garage"></div><button onclick="show('manual')">＋ Add Vehicle</button><button class="secondary" onclick="signOut()">Sign Out</button></div>
<div id="manual" class="section"><button class="secondary" onclick="goHome()">‹ Back</button><h1>Add Vehicle</h1><div class="panel"><label>Vehicle name *</label><input id="n"><label>Year</label><input id="y"><label>Make</label><input id="mk"><label>Model</label><input id="mo"><label>Body style</label><input id="bd"><label>Chassis / VIN</label><input id="ch"><label>Engine</label><input id="en"><label>Registration</label><input id="rg"><label>Notes</label><textarea id="nt"></textarea><button onclick="saveManual()">Save Vehicle</button></div></div>
<div id="record" class="section"><button class="secondary" onclick="goHome()">‹ Back</button><h1>Vehicle Passport</h1><div id="recordBody"></div></div>
<div id="scan" class="section"><button class="secondary" onclick="show('record');loadRecord()">‹ Back</button><h1>AI / OCR Evidence</h1><div class="panel"><label>Evidence type</label><select id="scanMode"><option value="vehicle_photo">Vehicle photo</option><option value="identifier_plate">Identifier / chassis plate</option><option value="document">Document image</option></select><input id="pic" type="file" accept="image/*" style="margin-top:12px"><button onclick="analyse()">Analyse Evidence</button><div id="scanMsg" class="small"></div></div><div id="scanResult"></div></div>
<div id="vault" class="section"><button class="secondary" onclick="show('record');loadRecord()">‹ Back</button><h1>Document Vault</h1><div class="panel"><label>Type</label><select id="docType"><option>Factory record</option><option>Registration</option><option>Ownership</option><option>Invoice</option><option>Service</option><option>Correspondence</option><option>Other</option></select><input id="docFile" type="file" accept="application/pdf,image/*"><button onclick="uploadDocument()">Upload</button></div><div id="docs"></div></div>
<div id="gallery" class="section"><button class="secondary" onclick="show('record');loadRecord()">‹ Back</button><h1>Gallery</h1><div class="panel"><label>Category</label><select id="mediaCategory"><option>Gallery</option><option>Identity plate</option><option>Engine</option><option>Chassis</option><option>Body tag</option><option>Registration</option><option>Period photo</option><option>Restoration</option><option>Other</option></select><input id="mediaFile" type="file" accept="image/*,video/mp4"><label>Caption</label><input id="mediaCaption"><button onclick="uploadMedia()">Add Media</button></div><div id="mediaList"></div></div>
<div id="maintenance" class="section"><button class="secondary" onclick="show('record');loadRecord()">‹ Back</button><h1>Maintenance</h1><div class="panel"><label>Date</label><input id="svcDate" type="date"><label>Mileage</label><input id="svcMileage"><label>Vendor</label><input id="svcVendor"><label>Description</label><textarea id="svcDescription"></textarea><label>Cost</label><input id="svcCost"><button onclick="addService()">Add Service</button></div><div id="services"></div></div></div></div>
<div id="nav" class="nav hidden"><div class="navin"><button onclick="goHome()">Garage</button><button onclick="show('record');loadRecord()">Passport</button><button onclick="show('vault');loadDocs()">Vault</button><button onclick="show('gallery');loadMedia()">Gallery</button></div></div>
<script>
const CK='hg4cfg',SK='hg4sel';let sb,user,cars=[],sel='',pending=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function cfg(){try{return JSON.parse(localStorage.getItem(CK)||'null')}catch{return null}}function saveCfg(){let u=cfgUrl.value.trim(),k=cfgKey.value.trim();if(!u||!k)return alert('Enter both values');localStorage.setItem(CK,JSON.stringify({u,k}));location.reload()}function makeSb(){let c=cfg();sb=supabase.createClient(c.u,c.k,{auth:{persistSession:true}})}async function boot(){if(!cfg())return;setup.classList.add('hidden');makeSb();let {data:{session}}=await sb.auth.getSession();if(session){user=session.user;enter()}else login.classList.remove('hidden')}async function signIn(){let {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error)return loginMsg.textContent=error.message;user=data.user;enter()}async function signOut(){await sb.auth.signOut();location.reload()}async function enter(){login.classList.add('hidden');main.classList.remove('hidden');nav.classList.remove('hidden');sel=localStorage.getItem(SK)||'';await loadCars();goHome()}function show(id){home.style.display='none';document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function goHome(){document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));home.style.display='block';render()}function cur(){return cars.find(v=>v.vehicle_id===sel)}function name(v){return [v.year,v.make,v.model].filter(Boolean).join(' ')||v.chassis_no_display||'Heritage vehicle'}async function loadCars(){let {data,error}=await sb.from('vehicles').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);cars=data||[];if(sel&&!cars.some(v=>v.vehicle_id===sel))sel='';render()}function render(){garage.innerHTML=cars.length?cars.map(v=>`<div class="vehicle" onclick="selectCar('${v.vehicle_id}')"><b>${esc(name(v))}</b><div class="small">${esc(v.chassis_no_display||'No chassis recorded')} · ${esc(v.visibility)}</div></div>`).join(''):'<div class="panel small">No vehicles yet.</div>'}async function selectCar(id){sel=id;localStorage.setItem(SK,id);await loadRecord();show('record')}
async function fact(vid,field,val,extra={}){if(!val)return;return sb.from('vehicle_facts').insert({vehicle_id:vid,field_name:field,asserted_value:String(val),status:'User-contributed',source_type:'Owner',source_reference:'Manual owner entry',asserted_by:user.id,...extra})}async function saveManual(){if(!n.value.trim())return alert('Enter vehicle name');let yr=y.value?Number(y.value):null,{data:v,error}=await sb.from('vehicles').insert({make:mk.value||null,model:mo.value||null,year:yr,current_owner_id:user.id,chassis_no_display:ch.value||null,current_condition_status:'Owner supplied',visibility:'private'}).select().single();if(error)return alert(error.message);for(let [f,val] of Object.entries({vehicle_name:n.value,make:mk.value,model:mo.value,body_style:bd.value,chassis_no:ch.value,engine_no:en.value,notes:nt.value,year:yr||''}))if(val)await fact(v.vehicle_id,f,val);if(rg.value){let {data:r}=await sb.from('registration_history').insert({vehicle_id:v.vehicle_id,registration_number:rg.value,is_current:true,confidence_status:'User-contributed'}).select().single();if(r)await sb.from('vehicles').update({current_registration_id:r.registration_id}).eq('vehicle_id',v.vehicle_id)}sel=v.vehicle_id;localStorage.setItem(SK,sel);await loadCars();await loadRecord();show('record')}
async function loadRecord(){let v=cur();if(!v)return recordBody.innerHTML='<div class="panel">Select a vehicle.</div>';let [fq,rq,hq]=await Promise.all([sb.from('vehicle_facts').select('*').eq('vehicle_id',sel).order('created_at',{ascending:false}),sb.from('registration_history').select('*').eq('vehicle_id',sel),sb.from('vehicle_history_events').select('*').eq('vehicle_id',sel)]);let f=fq.data||[],r=rq.data||[],h=hq.data||[];recordBody.innerHTML=`<div class="hero"><div class="k">Vehicle Passport</div><h2>${esc(name(v))}</h2><p>${esc(v.chassis_no_display||'')}</p></div><button onclick="show('scan')">＋ Add AI/OCR Evidence</button><button class="secondary" onclick="show('maintenance');loadServices()">Maintenance</button><div class="panel"><div class="k">Evidence assertions</div>${f.map(x=>`<div class="ev"><b>${esc(x.field_name)}</b>: ${esc(x.asserted_value)}<br><span class="tag">${esc(x.status)}</span><div class="small">${esc(x.source_reference||x.source_type)}</div></div>`).join('')||'<p class="small">None yet.</p>'}</div><div class="panel"><div class="k">Registration history</div>${r.map(x=>`<div class="ev"><b>${esc(x.registration_number)}</b> · ${esc(x.confidence_status)}</div>`).join('')||'<p class="small">None yet.</p>'}</div><div class="panel"><div class="k">Provenance / history</div>${h.map(x=>`<div class="ev"><b>${esc(x.event_type)}</b> ${esc(x.description)}</div>`).join('')||'<p class="small">None yet.</p>'}</div>`}
const b64=f=>new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)}),safe=s=>s.replace(/[^a-zA-Z0-9._-]+/g,'_'),pick=(o,ks)=>{for(let k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return null};async function preserveEvidence(file,mode){let isDoc=mode==='document',bucket=isDoc?'vehicle-documents':'vehicle-media',path=`${sel}/${Date.now()}-${safe(file.name||'evidence.jpg')}`;let {error:u}=await sb.storage.from(bucket).upload(path,file);if(u)throw u;if(isDoc){let {data,error}=await sb.from('documents').insert({vehicle_id:sel,document_type:'Other',file_path:path,uploaded_by:user.id,source_description:'Source image submitted for heritage-ai analysis',document_provenance:'owner-supplied',ai_scan_status:'Analyzing'}).select().single();if(error)throw error;return {document_id:data.document_id,path}}let cat=mode==='identifier_plate'?'Identity plate':'Gallery';let {data,error}=await sb.from('media_items').insert({vehicle_id:sel,type:'photo',media_category:cat,file_path:path,caption:'Source image submitted for heritage-ai analysis',uploaded_by:user.id,ocr_ai_status:'Analyzing'}).select().single();if(error)throw error;return {media_id:data.media_id,path}}
async function analyse(){let f=pic.files[0];if(!f||!sel)return alert('Select a vehicle and image');scanMsg.innerHTML='<span class="spin"></span> Preserving source and analysing…';scanResult.innerHTML='';try{let mode=scanMode.value,source=await preserveEvidence(f,mode),image_base64=await b64(f),v=cur(),{data,error}=await sb.functions.invoke('heritage-ai',{body:{mode,image_base64,context:{make:v.make,model:v.model,year:v.year,chassis:v.chassis_no_display}}});if(error)throw error;pending={mode,data,source};scanMsg.textContent='Original evidence preserved. Review AI/OCR result.';scanResult.innerHTML=`<div class="panel"><span class="tag">AI/OCR proposal — unverified</span><pre class="small">${esc(JSON.stringify(data?.result||data,null,2))}</pre><button onclick="acceptAI()">Accept as proposed evidence</button><button class="secondary" onclick="pending=null;scanResult.innerHTML=''">Discard proposal</button></div>`}catch(e){scanMsg.textContent='Analysis failed: '+e.message}}
async function acceptAI(){if(!pending)return;let o=pending.data?.result||pending.data,field='document_claim',val=JSON.stringify(o),st=pending.source,mode=pending.mode;if(mode==='identifier_plate'){field='chassis_no';val=pick(o,['exact_observed_text','exactObservedText','observed_text','text'])||val}else if(mode==='vehicle_photo'){field='vehicle_identity';val=JSON.stringify({make:pick(o,['possible_make','make']),model:pick(o,['possible_model','model']),year:pick(o,['approximate_year_or_year_range','
