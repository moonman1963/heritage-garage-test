<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09100d"><title>Heritage Prototype v0.43</title></head><body style="margin:0;background:#09100d;color:#f4efe7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div id="boot" style="padding:28px">Loading Heritage Prototype v0.43…</div><script>
(async()=>{
  const target='/index-v43.html';
  const closeScript='<'+ '/script>';
  async function resolve(path,depth=0){
    if(depth>60) throw new Error('Version chain is too deep.');
    const r=await fetch(path,{cache:'no-store'});
    if(!r.ok) throw new Error(path+' could not be loaded ('+r.status+').');
    const text=await r.text();
    const m=text.match(/fetch\(['"]([^'"]+\.html)['"]/);
    if(!m || !text.includes('document.write(h)')) return text;
    const previous=await resolve(m[1],depth+1);
    const sm=text.match(/<script>([\s\S]*)<\/script><\/body><\/html>\s*$/i);
    if(!sm) throw new Error('Could not parse '+path+'.');
    let written='';
    const mockDocument={
      body:{innerHTML:''},
      open(){},
      write(v){written+=String(v)},
      close(){}
    };
    const mockFetch=async()=>({ok:true,status:200,text:async()=>previous});
    const run=new Function('fetch','document','return '+sm[1]);
    await run(mockFetch,mockDocument);
    let out=written||mockDocument.body.innerHTML;
    if(!out) throw new Error('No output produced by '+path+'.');
    out=out.split('<\\/script>').join(closeScript);
    return out;
  }
  let html=await resolve(target);
  html=html.split('<\\/script>').join(closeScript);
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('boot').innerHTML='<h2>Heritage could not load</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()" style="padding:12px 16px">Retry</button>'});
</script></body></html>
