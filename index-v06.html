<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loading Heritage v0.6</title></head><body style="margin:0;background:#09100d;color:#f4efe7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div style="padding:28px">Loading Heritage Prototype v0.6…</div><script>
(async()=>{
  let res=await fetch('/index-v05.html',{cache:'no-store'}); if(!res.ok) throw new Error('Base prototype could not be loaded ('+res.status+').');
  let h=await res.text();
  h=h.replaceAll('Heritage Prototype v0.5','Heritage Prototype v0.6').replaceAll('Prototype v0.5 · Flows 1–3','Prototype v0.6 · Flows 1–3');
  h=h.replace('<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div>','<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div><div class="card"><b>Recent Activity</b><div class="muted" id="recentActivity">No recent activity.</div></div>');
  const start=h.indexOf('function openVehicle(v){'); const end=h.indexOf('function detail(n){',start); if(start<0||end<0) throw new Error('Base Vehicle Overview changed; v0.6 patch stopped safely.');
  const newFn=`async function openVehicle(v){
    if(!v)return; current=v; let overview=null; const id=String(v.vehicle_id||'');
    if(id.startsWith('demo')){const low=Number(v.record_completeness||0)<35;overview={vehicle:v,completeness:{total:Number(v.record_completeness||0),maximum:100,low_information_threshold:35},confidence:{identity_confidence:Number(v.identity_confidence||0),provenance_confidence:Number(v.provenance_confidence||0)},dashboard:{attention_count:low?1:0,attention_items:low?[{type:'low_information',label:'Low information'}]:[],active_flags:low?[{type:'low_information'}]:[],pending_disputes:0,pending_transfer:null,recent_activity:[{type:'demo',summary:'Demo record loaded',created_at:new Date().toISOString()}]}}}
    else{say('Loading live vehicle state…');const r=await sb.rpc('get_vehicle_overview_state',{p_vehicle_id:v.vehicle_id});if(r.error){say('Live vehicle state could not be loaded. Showing last available record values.',true);overview={vehicle:v,completeness:{total:Number(v.record_completeness||0)},confidence:{identity_confidence:Number(v.identity_confidence||0),provenance_confidence:Number(v.provenance_confidence||0)},dashboard:{attention_count:0,attention_items:[],active_flags:[],recent_activity:[]}}}else if(!r.data){say('Vehicle is no longer available or you no longer have access.',true);await loadGarage();return go('garage')}else{overview=r.data;say('')}}
    const live=overview.vehicle||v;current=live;const dash=overview.dashboard||{},conf=overview.confidence||{},complete=overview.completeness||{};
    $('vtitle').textContent=live.vehicle_name||[live.year,live.make,live.model].filter(Boolean).join(' ')||'Vehicle';$('vmeta').textContent=[live.heritage_id,live.chassis_no&&'Chassis '+live.chassis_no,live.registration_no&&'Reg '+live.registration_no].filter(Boolean).join(' · ');
    let pills='<span class="pill">'+esc(live.lifecycle_state||'active')+'</span><span class="pill">'+esc(live.visibility||'private')+'</span>';(dash.active_flags||[]).slice(0,3).forEach(f=>pills+='<span class="pill">'+esc(String(f.type||'').replaceAll('_',' '))+'</span>');$('vpills').innerHTML=pills;
    $('comp').textContent=Math.round(Number(complete.total??live.record_completeness??0))+'%';$('ident').textContent=Math.round(Number(conf.identity_confidence??live.identity_confidence??0))+'%';$('prov').textContent=Math.round(Number(conf.provenance_confidence??live.provenance_confidence??0))+'%';
    const items=Array.isArray(dash.attention_items)?dash.attention_items:[],count=Number(dash.attention_count??items.length??0);$('attentionTitle').textContent=count?'Needs Attention · '+count:'Needs Attention';$('attention').innerHTML=count?items.slice(0,3).map(x=>'• '+esc(x.label||x.type)).join('<br>')+(count>3?'<br>+'+(count-3)+' more':''):'No active attention items.';
    if(dash.pending_transfer)$('attention').innerHTML+=($('attention').innerHTML?'<br>':'')+'Transfer pending — another transfer and permanent identity changes are restricted.';
    const acts=Array.isArray(dash.recent_activity)?dash.recent_activity:[],ra=$('recentActivity');if(ra)ra.innerHTML=acts.length?acts.slice(0,5).map(a=>'<div style="padding:6px 0;border-bottom:1px solid #27312c"><b>'+esc(a.summary||String(a.type||'Activity').replaceAll('_',' '))+'</b><br><span class="muted">'+esc(a.created_at?new Date(a.created_at).toLocaleString():'')+'</span></div>').join(''):'No recent activity.';go('vehicle')
  }`;
  h=h.slice(0,start)+newFn+h.slice(end);document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<div style="padding:28px"><h2>Heritage v0.6 could not load</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()" style="padding:12px 16px">Retry</button></div>'});
</script></body></html>
