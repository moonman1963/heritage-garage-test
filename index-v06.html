<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loading Heritage v0.6</title></head><body style="margin:0;background:#09100d;color:#f4efe7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div style="padding:28px">Loading Heritage Prototype v0.6…</div><script>
(async()=>{
  let res=await fetch('/index-v05.html',{cache:'no-store'}); if(!res.ok) throw new Error('Base prototype could not be loaded ('+res.status+').');
  let h=await res.text();
  h=h.replaceAll('Heritage Prototype v0.5','Heritage Prototype v0.6').replaceAll('Prototype v0.5 · Flows 1–3','Prototype v0.6 · Flows 1–3');
  h=h.replace("let user=null,demoMode=false,current=null,step=1,draft={},matchState='unchecked',checkedFingerprint='';","let user=null,demoMode=false,current=null,currentOverview=null,step=1,draft={},matchState='unchecked',checkedFingerprint='';");
  h=h.replace('<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div>','<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div><div class="card"><b>Recent Activity</b><div class="muted" id="recentActivity">No recent activity.</div></div>');
  const start=h.indexOf('function openVehicle(v){'); const end=h.indexOf('function detail(n){',start); if(start<0||end<0) throw new Error('Base Vehicle Overview changed; v0.6 patch stopped safely.');
  const newFn=`async function openVehicle(v){
    if(!v)return; current=v; let overview=null; const id=String(v.vehicle_id||'');
    if(id.startsWith('demo')){const low=Number(v.record_completeness||0)<35;overview={vehicle:v,completeness:{core_identity:35,provenance_evidence:15,documents:10,media:7,profile_context:5,total:Number(v.record_completeness||72),maximum:100,low_information_threshold:35},confidence:{identity_confidence:Number(v.identity_confidence||88),provenance_confidence:Number(v.provenance_confidence||76),identity_rule:'weighted canonical identity fields using one source-tier model',provenance_rule:'provenance facts and sourced documents use the same source-tier model'},dashboard:{attention_count:low?1:0,attention_items:low?[{type:'low_information',label:'Low information'}]:[],active_flags:low?[{type:'low_information'}]:[],pending_disputes:0,pending_transfer:null,recent_activity:[{type:'demo',summary:'Demo record loaded',created_at:new Date().toISOString()}]}}}
    else{say('Loading live vehicle state…');const r=await sb.rpc('get_vehicle_overview_state',{p_vehicle_id:v.vehicle_id});if(r.error){say('Live vehicle state could not be loaded. Showing last available record values.',true);overview={vehicle:v,completeness:{total:Number(v.record_completeness||0)},confidence:{identity_confidence:Number(v.identity_confidence||0),provenance_confidence:Number(v.provenance_confidence||0)},dashboard:{attention_count:0,attention_items:[],active_flags:[],recent_activity:[]}}}else if(!r.data){say('Vehicle is no longer available or you no longer have access.',true);await loadGarage();return go('garage')}else{overview=r.data;say('')}}
    currentOverview=overview; const live=overview.vehicle||v;current=live;const dash=overview.dashboard||{},conf=overview.confidence||{},complete=overview.completeness||{};
    $('vtitle').textContent=live.vehicle_name||[live.year,live.make,live.model].filter(Boolean).join(' ')||'Vehicle';$('vmeta').textContent=[live.heritage_id,live.chassis_no&&'Chassis '+live.chassis_no,live.registration_no&&'Reg '+live.registration_no].filter(Boolean).join(' · ');
    let pills='<span class="pill">'+esc(live.lifecycle_state||'active')+'</span><span class="pill">'+esc(live.visibility||'private')+'</span>';(dash.active_flags||[]).slice(0,3).forEach(f=>pills+='<span class="pill">'+esc(String(f.type||'').replaceAll('_',' '))+'</span>');$('vpills').innerHTML=pills;
    $('comp').textContent=Math.round(Number(complete.total??live.record_completeness??0))+'%';$('ident').textContent=Math.round(Number(conf.identity_confidence??live.identity_confidence??0))+'%';$('prov').textContent=Math.round(Number(conf.provenance_confidence??live.provenance_confidence??0))+'%';
    const items=Array.isArray(dash.attention_items)?dash.attention_items:[],count=Number(dash.attention_count??items.length??0);$('attentionTitle').textContent=count?'Needs Attention · '+count:'Needs Attention';$('attention').innerHTML=count?items.slice(0,3).map(x=>'• '+esc(x.label||x.type)).join('<br>')+(count>3?'<br>+'+(count-3)+' more':''):'No active attention items.';
    if(dash.pending_transfer)$('attention').innerHTML+=($('attention').innerHTML?'<br>':'')+'Transfer pending — another transfer and permanent identity changes are restricted.';
    const acts=Array.isArray(dash.recent_activity)?dash.recent_activity:[],ra=$('recentActivity');if(ra)ra.innerHTML=acts.length?acts.slice(0,5).map(a=>'<div style="padding:6px 0;border-bottom:1px solid #27312c"><b>'+esc(a.summary||String(a.type||'Activity').replaceAll('_',' '))+'</b><br><span class="muted">'+esc(a.created_at?new Date(a.created_at).toLocaleString():'')+'</span></div>').join(''):'No recent activity.';go('vehicle')
  }`;
  h=h.slice(0,start)+newFn+h.slice(end);
  const ds=h.indexOf('function detail(n){'); const de=h.indexOf('function startFlow(){',ds); if(ds<0||de<0) throw new Error('Base detail routing changed; v0.6 detail patch stopped safely.');
  const detailFn=`function detail(n){
    $('dtitle').textContent=n; const o=currentOverview||{},c=o.completeness||{},q=o.confidence||{},d=o.dashboard||{};
    let copy='',extra='';
    if(n==='Record'){
      copy='Record Completeness measures how much useful information is present. It is separate from Identity and Provenance Confidence.';
      const rows=[['Core Identity',c.core_identity,45],['Provenance / Evidence',c.provenance_evidence,20],['Documents',c.documents,20],['Media',c.media,10],['Profile Context',c.profile_context,5]];
      extra='<div class="status"><b>Record Completeness · '+Math.round(Number(c.total??current?.record_completeness??0))+'%</b><br><span class="muted">All five categories total 100. Low Information applies only below '+Number(c.low_information_threshold??35)+'%.</span></div>'+rows.map(r=>'<div class="summary"><span>'+r[0]+'</span><b>'+Math.round(Number(r[1]??0))+' / '+r[2]+'</b></div>').join('')+'<div class="status"><b>Identity Confidence · '+Math.round(Number(q.identity_confidence??current?.identity_confidence??0))+'%</b><br><span class="muted">Trust in the vehicle identity, not record volume.</span></div><div class="status"><b>Provenance Confidence · '+Math.round(Number(q.provenance_confidence??current?.provenance_confidence??0))+'%</b><br><span class="muted">Trust in history and provenance evidence, not completeness.</span></div>';
    }else if(n==='Provenance'){
      copy='Provenance uses source-labelled claims. A challenge attaches to the exact fact, moves through review, and leaves a recorded outcome.';
      extra='<div class="status"><b>Provenance Confidence · '+Math.round(Number(q.provenance_confidence??current?.provenance_confidence??0))+'%</b><br><span class="muted">'+esc(q.provenance_rule||'Calculated from provenance facts and sourced documents.')+'</span></div><div class="summary"><span>Government Confirmed</span><b>100%</b></div><div class="summary"><span>Club Confirmed</span><b>85%</b></div><div class="summary"><span>User Contributed</span><b>55%</b></div><div class="summary"><span>System</span><b>40%</b></div><div class="summary"><span>Unverified</span><b>25%</b></div><div class="status"><b>Challenge a claim</b><br><span class="muted">Select the exact fact, add reason/evidence, submit, then track review outcome. Disputed and under-review claims are discounted while unresolved.</span></div>'+(Number(d.pending_disputes||0)?'<div class="match possible"><b>'+Number(d.pending_disputes)+' pending dispute'+(Number(d.pending_disputes)===1?'':'s')+'</b><br><span class="muted">These also appear in Needs Attention and Recent Activity.</span></div>':'');
    }else if(n==='People & Access'){copy='Roles provide defaults; permissions remain vehicle-specific. A transfer recipient does not become owner until transfer completes.'}
    else if(n==='Transfer Ownership'){copy='Permanent vehicle identity and QR remain with the vehicle. Private owner-workspace data does not transfer automatically.';extra='<div class="status"><b>Transfer Pending restrictions</b><br><span class="muted">Another transfer and permanent identity changes are blocked; normal enrichment may continue.</span></div>'}
    else if(n==='Physical Badge'){copy='A physical badge pairs to the existing permanent Vehicle ID; replacement never creates a new identity.'}
    else if(n==='Use & Share'){copy='One Visibility Policy controls public links and QR-scanner exposure.'}
    else if(n==='Maintenance'){copy='Completed history and future schedules remain separate.'}
    else if(n==='Manage'){copy='Maintenance, projects, vendors, costs, valuation and access.'}
    else copy='Prototype destination for '+n+'.';
    $('dcopy').textContent=copy;$('dextra').innerHTML=extra;go('detail')
  }`;
  h=h.slice(0,ds)+detailFn+h.slice(de);document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<div style="padding:28px"><h2>Heritage v0.6 could not load</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()" style="padding:12px 16px">Retry</button></div>'});
</script></body></html>
