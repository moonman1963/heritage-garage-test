<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loading Heritage v0.6</title></head><body style="margin:0;background:#09100d;color:#f4efe7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div style="padding:28px">Loading Heritage Prototype v0.6…</div><script>
(async()=>{
  let h=await (await fetch('/index-v05.html',{cache:'no-store'})).text();
  h=h.replaceAll('Heritage Prototype v0.5','Heritage Prototype v0.6').replaceAll('Prototype v0.5 · Flows 1–3','Prototype v0.6 · Flows 1–3');
  h=h.replace('<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div>','<div class="card"><b id="attentionTitle">Needs Attention</b><div class="muted" id="attention"></div></div><div class="card"><b>Recent Activity</b><div class="muted" id="recentActivity">No recent activity.</div></div>');
  const oldFn=`function openVehicle(v){current=v;$('vtitle').textContent=v.vehicle_name||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle';$('vmeta').textContent=[v.heritage_id,v.chassis_no&&'Chassis '+v.chassis_no,v.registration_no&&'Reg '+v.registration_no].filter(Boolean).join(' · ');$('vpills').innerHTML='<span class="pill">'+esc(v.lifecycle_state||'active')+'</span><span class="pill">'+esc(v.visibility||'private')+'</span>';$('comp').textContent=(v.record_completeness??0)+'%';$('ident').textContent=(v.identity_confidence??0)+'%';$('prov').textContent=(v.provenance_confidence??0)+'%';let low=(v.record_completeness??0)<35;$('attentionTitle').textContent=low?'Needs Attention · 1':'Needs Attention';$('attention').textContent=low?'Low information — add key identity and record details.':'No critical items in this prototype record.';go('vehicle')}`;
  const newFn=`async function openVehicle(v){
    if(!v)return; current=v; let overview=null;
    const id=String(v.vehicle_id||'');
    if(id.startsWith('demo')){
      const low=(Number(v.record_completeness||0)<35);
      overview={vehicle:v,completeness:{total:Number(v.record_completeness||0),maximum:100,low_information_threshold:35},confidence:{identity_confidence:Number(v.identity_confidence||0),provenance_confidence:Number(v.provenance_confidence||0)},dashboard:{attention_count:low?1:0,attention_items:low?[{type:'low_information',label:'Low information'}]:[],pending_disputes:0,pending_transfer:null,recent_activity:[{type:'demo',summary:'Demo record loaded',created_at:new Date().toISOString()}]}};
    }else{
      const r=await sb.rpc('get_vehicle_overview_state',{p_vehicle_id:v.vehicle_id});
      if(r.error){say('Could not load live vehicle state: '+r.error.message,true);overview={vehicle:v,completeness:{total:Number(v.record_completeness||0)},confidence:{identity_confidence:Number(v.identity_confidence||0),provenance_confidence:Number(v.provenance_confidence||0)},dashboard:{attention_count:0,attention_items:[],recent_activity:[]}}}else overview=r.data||{};
    }
    const live=overview.vehicle||v; current=live; const dash=overview.dashboard||{}; const conf=overview.confidence||{}; const complete=overview.completeness||{};
    $('vtitle').textContent=live.vehicle_name||[live.year,live.make,live.model].filter(Boolean).join(' ')||'Vehicle';
    $('vmeta').textContent=[live.heritage_id,live.chassis_no&&'Chassis '+live.chassis_no,live.registration_no&&'Reg '+live.registration_no].filter(Boolean).join(' · ');
    let pills='<span class="pill">'+esc(live.lifecycle_state||'active')+'</span><span class="pill">'+esc(live.visibility||'private')+'</span>';
    (dash.active_flags||[]).slice(0,3).forEach(f=>pills+='<span class="pill">'+esc(String(f.type||'').replaceAll('_',' '))+'</span>'); $('vpills').innerHTML=pills;
    $('comp').textContent=Math.round(Number(complete.total??live.record_completeness??0))+'%';
    $('ident').textContent=Math.round(Number(conf.identity_confidence??live.identity_confidence??0))+'%';
    $('prov').textContent=Math.round(Number(conf.provenance_confidence??live.provenance_confidence??0))+'%';
    const items=dash.attention_items||[]; const count=Number(dash.attention_count??items.length??0); $('attentionTitle').textContent=count?'Needs Attention · '+count:'Needs Attention';
    if(!count){$('attention').textContent='No active attention items.'}else{$('attention').innerHTML=items.slice(0,3).map(x=>'• '+esc(x.label||x.type)).join('<br>')+(count>3?'<br>+'+(count-3)+' more':'')}
    const acts=dash.recent_activity||[]; const ra=$('recentActivity'); if(ra)ra.innerHTML=acts.length?acts.slice(0,5).map(a=>'<div style="padding:6px 0;border-bottom:1px solid #27312c"><b>'+esc(a.summary||String(a.type||'Activity').replaceAll('_',' '))+'</b><br><span class="muted">'+esc(a.created_at?new Date(a.created_at).toLocaleString():'')+'</span></div>').join(''):'No recent activity.';
    if(dash.pending_transfer){$('attention').innerHTML+=($('attention').innerHTML?'<br>':'')+'Transfer pending — another transfer and permanent identity changes are restricted.'}
    go('vehicle');
  }`;
  if(!h.includes(oldFn)) throw new Error('v0.5 openVehicle signature changed; v0.6 patch stopped safely.');
  h=h.replace(oldFn,newFn);
  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<div style="padding:28px"><h2>Heritage v0.6 could not load</h2><p>'+String(e.message||e)+'</p></div>'});
</script></body></html>
