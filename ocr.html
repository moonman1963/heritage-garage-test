<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09100d"><title>Heritage OCR v0.49</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>:root{--bg:#09100d;--panel:#141a17;--line:#2e3933;--gold:#c8aa6d;--text:#f4efe7;--muted:#a8b0aa;--green:#183b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:680px;margin:auto;padding:24px 16px 80px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.crest{width:54px;height:54px;border:2px solid var(--gold);border-radius:18px;display:grid;place-items:center;color:var(--gold);font:700 20px Georgia}h1,h2,h3{font-family:Georgia;margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.muted{color:var(--muted);font-size:13px;line-height:1.5}.btn{width:100%;border:1px solid var(--gold);background:var(--green);color:var(--text);padding:13px;border-radius:14px;font-weight:700;margin-top:10px}.btn:disabled{opacity:.5}.pill{display:inline-block;border:1px solid #59665f;border-radius:999px;padding:5px 8px;font-size:11px;margin-top:6px}.error{color:#ffb8b8}.success{color:#a4e1bd}.progress{white-space:pre-wrap;font-size:12px;color:var(--muted);margin-top:9px}</style></head><body><main class="app"><div class="brand"><div class="crest">HG</div><div><h1>Heritage OCR</h1><div class="muted">PDF text extraction & OCR foundation v0.49</div></div></div><div class="card"><b>How it works</b><p class="muted">Heritage first reads embedded PDF text. If a page is a scan with little or no text, that page is rendered and OCR is run in the browser. The original PDF stays unchanged and private.</p><button class="btn" onclick="location.href='/'">Back to Heritage</button></div><div id="status" class="muted">Loading your PDF documents…</div><div id="list"></div></main><script>const U='https://aussibufjvikngojwczy.supabase.co',K='sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i',BUCKET='heritage-vehicle-files',sb=supabase.createClient(U,K),$=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let user=null,docs=[];async function init(){const{data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){$('status').innerHTML='<span class="error">You are not signed in. Go back to Heritage, sign in, then return to this OCR page.</span>';return}const{data:roles,error:rerr}=await sb.from('vehicle_roles').select('vehicle_id').eq('user_id',user.id).eq('status','active');if(rerr){$('status').textContent=rerr.message;return}let ids=(roles||[]).map(x=>x.vehicle_id);if(!ids.length){$('status').textContent='No accessible vehicles.';return}const{data:d,error}=await sb.from('documents').select('document_id,vehicle_id,title,document_type,file_path,extraction_status,extraction_method,extracted_at,extracted_text').in('vehicle_id',ids).order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}docs=(d||[]).filter(x=>String(x.file_path||'').toLowerCase().includes('.pdf'));$('status').textContent=docs.length?docs.length+' PDF document(s) available.':'No uploaded PDF documents yet.';render()}function render(){$('list').innerHTML=docs.map(d=>'<div class="card"><h3>'+esc(d.title||'PDF Document')+'</h3><div class="pill">'+esc(d.extraction_status||'not_processed')+'</div><p class="muted">'+esc(d.extraction_method||'Not processed')+(d.extracted_at?' · '+new Date(d.extracted_at).toLocaleString():'')+'</p>'+(d.extracted_text?'<details><summary>View extracted text</summary><pre class="progress">'+esc(d.extracted_text.slice(0,12000))+'</pre></details>':'')+'<button class="btn" data-ocr="'+d.document_id+'">Extract Text / OCR</button><div class="progress" id="p-'+d.document_id+'"></div></div>').join('');document.querySelectorAll('[data-ocr]').forEach(b=>b.onclick=()=>processDoc(b.dataset.ocr,b))}async function processDoc(id,button){let d=docs.find(x=>x.document_id===id),p=$('p-'+id);button.disabled=true;p.textContent='Preparing document…';await sb.from('documents').update({extraction_status:'processing',extraction_error:null}).eq('document_id',id);try{const{data:blob,error:derr}=await sb.storage.from(BUCKET).download(d.file_path);if(derr)throw derr;const bytes=new Uint8Array(await blob.arrayBuffer());const pdf=await pdfjsLib.getDocument({data:bytes}).promise;let out=[],usedOcr=false;const maxPages=Math.min(pdf.numPages,20);for(let i=1;i<=maxPages;i++){p.textContent='Page '+i+' of '+maxPages+'…';const page=await pdf.getPage(i);const tc=await page.getTextContent();let text=(tc.items||[]).map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();if(text.length>=40){out.push('--- Page '+i+' ---\n'+text);continue}usedOcr=true;p.textContent='Page '+i+' of '+maxPages+' — scanned page, running OCR…';const viewport=page.getViewport({scale:1.7});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;const res=await Tesseract.recognize(canvas,'eng',{logger:m=>{if(m.status==='recognizing text')p.textContent='Page '+i+' of '+maxPages+' — OCR '+Math.round((m.progress||0)*100)+'%'}});text=(res.data?.text||'').trim();out.push('--- Page '+i+' (OCR) ---\n'+text);canvas.width=1;canvas.height=1}if(pdf.numPages>20)out.push('\n[Processing limited to first 20 pages in this test build.]');const extracted=out.join('\n\n').trim();const method=usedOcr?'embedded_text_plus_tesseract_ocr':'embedded_pdf_text';const status=usedOcr?'ocr_complete':'text_extracted';const{error:uerr}=await sb.from('documents').update({extracted_text:extracted,extraction_status:status,extraction_method:method,extracted_at:new Date().toISOString(),extraction_error:null}).eq('document_id',id);if(uerr)throw uerr;d.extracted_text=extracted;d.extraction_status=status;d.extraction_method=method;d.extracted_at=new Date().toISOString();p.className='progress success';p.textContent='Complete. '+(usedOcr?'OCR was used for scanned page(s).':'Embedded PDF text was extracted; OCR was not needed.');render()}catch(e){await sb.from('documents').update({extraction_status:'failed',extraction_error:String(e.message||e)}).eq('document_id',id);p.className='progress error';p.textContent='Extraction failed: '+String(e.message||e);button.disabled=false}}init();</script></body></html>
