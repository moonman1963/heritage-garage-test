<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09100d"><title>Heritage Password Reset</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#09100d;--panel:#141a17;--line:#2e3933;--gold:#c8aa6d;--text:#f4efe7;--muted:#a8b0aa;--green:#183b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:620px;margin:auto;padding:28px 16px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.crest{width:56px;height:56px;border:2px solid var(--gold);border-radius:18px;display:grid;place-items:center;color:var(--gold);font:700 20px Georgia}h1,h2{font-family:Georgia;margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.muted{color:var(--muted);line-height:1.5}.hidden{display:none}label{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 5px}input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0f1512;color:var(--text);font-size:16px}.btn{width:100%;border:1px solid var(--gold);background:var(--green);color:var(--text);padding:14px;border-radius:14px;font-weight:700;margin-top:12px}.success{color:#a4e1bd}.error{color:#ffb8b8}</style></head><body><main class="app"><div class="brand"><div class="crest">HG</div><div><h1>Heritage</h1><div class="muted">Password recovery</div></div></div><div id="request" class="card"><h2>Reset your password</h2><p class="muted">Enter the email address used for your Heritage test account.</p><label>Email</label><input id="email" type="email" autocomplete="email"><button class="btn" id="send">Send Reset Email</button><div id="msg" class="muted" style="margin-top:12px"></div></div><div id="change" class="card hidden"><h2>Choose a new password</h2><p class="muted">Enter the new password you want to use for Heritage.</p><label>New password</label><input id="p1" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="p2" type="password" autocomplete="new-password"><button class="btn" id="save">Save New Password</button><div id="changeMsg" class="muted" style="margin-top:12px"></div></div></main><script>const U='https://aussibufjvikngojwczy.supabase.co',K='sb_publishable_R1Qa1N4QB82xiYlein2iLw_BWDioM8i',sb=supabase.createClient(U,K),$=id=>document.getElementById(id);function showChange(){ $('request').classList.add('hidden');$('change').classList.remove('hidden') }sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(session&&location.hash))showChange()});(async()=>{const{data}=await sb.auth.getSession();if(data.session&&location.hash)showChange()})();$('send').onclick=async()=>{let e=$('email').value.trim(),m=$('msg');if(!e){m.className='error';m.textContent='Enter your email address.';return}m.className='muted';m.textContent='Sending…';const redirect=location.origin+'/reset-password.html';const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:redirect});if(error){m.className='error';m.textContent=error.message;return}m.className='success';m.textContent='Reset email sent. Open the email on this phone and tap the reset link.'};$('save').onclick=async()=>{let a=$('p1').value,b=$('p2').value,m=$('changeMsg');if(a.length<6){m.className='error';m.textContent='Use at least 6 characters.';return}if(a!==b){m.className='error';m.textContent='The passwords do not match.';return}m.className='muted';m.textContent='Saving…';const{error}=await sb.auth.updateUser({password:a});if(error){m.className='error';m.textContent=error.message;return}m.className='success';m.textContent='Password updated. Return to the Heritage test page and sign in.'};</script></body></html>
